[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "python311", "uv"]

[phases.install]
cmds = [
  "pnpm install --no-frozen-lockfile",
  "uv venv /app/.venv --python python3",
  "uv pip install --python /app/.venv/bin/python -r requirements-g4f.txt",
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-server run build",
  "pnpm --filter @workspace/ai-agent run build"
]

[start]
cmd = "PYTHON_BIN=/app/.venv/bin/python PORT=$PORT NODE_ENV=production node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
