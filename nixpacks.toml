[phases.setup]
nixPkgs = ["nodejs_20", "pnpm", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pnpm install --no-frozen-lockfile",
  "python3 -m pip install --break-system-packages -r requirements-g4f.txt",
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-server run build",
  "pnpm --filter @workspace/ai-agent run build"
]

[start]
cmd = "PORT=$PORT NODE_ENV=production node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
